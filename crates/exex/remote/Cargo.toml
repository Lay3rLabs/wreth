[package]
name = "reth-exex-remote"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Remote ExEx gRPC server for streaming execution notifications to external consumers"

[lints]
workspace = true

[dependencies]
# reth
reth-exex.workspace = true
reth-exex-types = { workspace = true, features = ["serde", "serde-bincode-compat"] }
reth-node-api.workspace = true
reth-primitives-traits.workspace = true
reth-tracing.workspace = true

# serialization
serde.workspace = true

# async
tokio = { workspace = true, features = ["sync"] }
tokio-stream.workspace = true
futures-util.workspace = true

# grpc
tonic.workspace = true
prost.workspace = true

# serialization
bincode = "1"
serde_with.workspace = true

# error handling
eyre.workspace = true

[build-dependencies]
tonic-build.workspace = true

[dev-dependencies]
# reth test utilities
reth-exex-test-utils.workspace = true
reth-exex-types = { workspace = true, features = ["serde", "serde-bincode-compat"] }
reth-ethereum-primitives.workspace = true
reth-execution-types.workspace = true
reth-chainspec.workspace = true

# testing
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
tokio-stream.workspace = true
rand.workspace = true

# serialization for tests
bincode = "1"
serde.workspace = true
serde_with.workspace = true

[features]
default = []
